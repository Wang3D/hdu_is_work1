name: Work 1 security CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hdu_is_work1
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hdu_is_work1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hdu_is_work1
      JWT_SECRET: ci-only-test-secret
      JWT_ISSUER: hdu-work1
      JWT_AUDIENCE: hdu-work1-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: SAST - Bandit
        run: bandit -r app manage.py run.py -f json -o bandit-report.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements-dev.txt
      - name: Tests
        run: pytest -q
